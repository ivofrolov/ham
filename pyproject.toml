[project]
name = "ham"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
  "paho-mqtt~=2.1",
]

[project.scripts]
ham = "ham.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ham"]

[tool.setuptools.dynamic]
version = {attr = "ham.__version__"}

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
